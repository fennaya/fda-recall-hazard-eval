[project]
name = "fda-recall-hazard"
version = "0.1.0"
description = "Evaluation harness for FDA drug recall hazard classification"
readme = "README.md"
authors = [
    { name = "fennaya", email = "emssaadaya@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.3",
    "plotly>=7.0.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
fda-ingest = "fda_hazard.ingest:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fda_hazard"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
